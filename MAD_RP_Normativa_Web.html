las lógicas, maniobrar en el aire lo cual no es fácil para que caigan en una pieza, meterse a zonas de rieles o lagos profundos."}, {"k": "b", "t": "El uso de vehículos 4x4 o motocicletas en montañas o zonas difíciles para un compacto o super está permitido, pero deben ser lógicos y más realistas, nada de acelerar a 180 para subir montañas solo porque quieren esquivar un rol, ya que saben que no los van a seguir, pero ustedes tampoco respetan la regla del PG."}], "lv": null}]}, {"id": "s13-reglamento-coches-blinda", "title": "Reglamento Coches Blindados & Torretas", "cards": [{"title": null, "blocks": [{"k": "li", "t": "Blindados solo pueden ser usados en DEFCON 3"}, {"k": "li", "t": "Torretas solo pueden ser usados en DEFCON 5"}, {"k": "b", "t": "Torretas solo son usables en DEFCON 5 ( Enviada por policía, o zonas calientes ) A la vez pueden ser usadas para transporte pues debemos llevarlas a zona roja."}, {"k": "li", "t": "Deben ubicar la zona roja, si las torretas están fuera de la zona no contarán y sería una sanción o reporte."}, {"k": "li", "t": "Si la torreta está en zona roja y los contrarios están fuera, se puede dispararles mientras la de adentro no deje la zona roja."}, {"k": "li", "t": "Solo podemos usar 1 blindada y 1 blindada con torreta por grupo, solo podemos combinar los blindados, osea podemos llevar 2 blindados mas no 2 torretas"}, {"k": "li", "t": "Solo pueden ser usados por el conductor y artillero, los demás tripulantes antes de llegar o empezar el rol tendrán que bajarse"}, {"k": "li", "t": "Está prohibido disparar la torreta con más de 2 personas dentro del blindado"}, {"k": "b", "t": "ESTANDO ARRIBA DE UN BLINDADO ESTÁ PROHIBIDO DISPARAR, Los autos están blindados entonces no podemos bajar ventanas si se ve esto serán sancionados."}], "lv": null}]}, {"id": "s14-reglamento-armas-o-tems-", "title": "Reglamento Armas o Ítems Exclusivos", "cards": [{"title": "1 - Armamento", "blocks": [{"k": "p", "t": "No podemos usar armas de otras facciones o exclusivas."}, {"k": "b", "t": "Ejemplo:"}, {"k": "p", "t": "Soy policía, yo no puedo usar armamento ilegal ni armamento exclusivo de usuarios."}, {"k": "b", "t": "Podemos retirar las armas exclusivas o de facciones que no son a la que estás actualmente."}, {"k": "p", "t": "Está prohibido usar las mismas mencionadas, estas solo servirán para tradear en sistemas de crafteo que se agregarán para intercambiar por armas que si puedas usar ( bandas, facciones legales etc. ) ."}, {"k": "p", "t": "Si usamos las armas exclusivas o de otras facciones"}, {"k": "b", "t": "Ejemplo:"}, {"k": "p", "t": "La policía usando armas de panadero, es reportable y una sanción directa al usuario si, estas armas pueden ser tomadas vivo o muerto."}], "lv": null}, {"title": "2 - Ítems No Robables", "blocks": [{"k": "p", "t": "No podemos robar objetos de facciones"}, {"k": "p", "t": "Esto de ejemplo incluye no robar tasers, macanas, a policías, no robar kits médicos, medicinas a los médicos, no robar kits de reparación a mecánicos…"}, {"k": "p", "t": "Esto aplica para usuarios estando en servicio, si yo tengo las cosas de facción, pero no estoy en servicio ejemplo de policía, puedes retirarlas, pero estas mismas no tienen uso servirán para tradear con la facción correspondiente."}], "lv": null}]}, {"id": "s15-reglamento-de-reportes", "title": "Reglamento De Reportes", "cards": [{"title": null, "blocks": [{"k": "p", "t": "Para temas de reportes este es el reglamento a seguir"}, {"k": "li", "t": "Para reportar es indispensable estar fuera de rol o en modo pasivo"}, {"k": "li", "t": "Para validar un reporte se deben contar con pruebas del problema, bug, falla etc, si solo vienes con texto es difícil validar tu caso en cualquier situación por ende necesitamos pruebas para resolver reportes de antirol, bugs, fallas del servidor etc."}, {"k": "li", "t": "Para reportar necesitamos pruebas en fotos, videos dependiendo de la gravedad del antirol o temas de reportes largos"}, {"k": "li", "t": "Prohibido abrir reporte en medio de rol, esto será nulo de tu parte y no se te atendera nada conforme a eso"}, {"k": "li", "t": "Prohibido solicitar logs o info al staff, el que reporta es el usuario por ende debe tener pruebas para defender su caso, conforme eso el staff decidirá si revisar en logs y herramientas para solucionarlo"}, {"k": "li", "t": "Solo podemos abrir 1 reporte a la vez, por ende si son reportes donde hay múltiples perspectivas del grupo reportando solo 1 persona debe hacerlo no abrir multireportes, pónganse de acuerdo"}, {"k": "li", "t": "Prohibido usar pruebas externas a sus grabaciones personales (usar streams de compañeros de la comunidad, pruebas de días anteriores, pruebas que no sean de amigos del mismo rol o externos que no tienen nada que ver etc...)"}, {"k": "li", "t": "El staff apoyara el reporte y se basará en las normativas, se le recomienda al usuario hacer lo mismo de esta manera estarán todos en la misma hoja y será más rápido de resolver y siguiente gastar menos tiempo por situaciones de antirol o bugs"}, {"k": "li", "t": "Prohibido reportar después de que se REPORTÓ UN ROL Y HAZ PERDIDO EL REPORTE, esto es RAGE entonces si se ha perdido el reporte no puedes contra reportar, eso se debe resolver en la conversación del reporte inicial del antirol"}, {"k": "li", "t": "… la MAD RP conforme una sanción, baneo, strike, molestias y demás serán sancionados muteados y posible baneo dependiendo su actitud"}, {"k": "li", "t": "Las pruebas en video siempre deberán estar limpias, para poder recabar información lo más correcta posible y resolver fácilmente el tema (esto incluye cortar el audio, tapar voces, clips cortos donde se vea solo lo malo de un lado para aprovechamiento (y en casos donde el otro lado se vea que en realidad solo lo haces por conveniencia) etc…"}, {"k": "li", "t": "EL USO DE DISCORD EN LOS CLIPS ANULARA TU REPORTE DE AHORA EN ADELANTE ( Esta regla es en base a la que todos conocemos de MANTENER TODO EL ROL IN GAME, Por ende el uso de la radio es obligatorio para clips y comunicación dentro del juego, EL USO DE DISCORD ES SANCIÓN DIRECTA Y ANULACIÓN DE REPORTE EN CASOS DE ANTIROL."}], "lv": null}]}]}};
const $=s=>document.querySelector(s), el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tabs=$('#tabs'); let io;
Object.entries(DATA).forEach(([k,v])=>tabs.append(el(`<button role="tab" class="tab" data-k="${k}" aria-selected="false">${E(v.label)}</button>`)));
tabs.onclick=e=>{const b=e.target.closest('.tab'); if(b) location.hash=b.dataset.k};
const rules=a=>a.map(t=>`<p class="rule">${E(t)}</p>`).join('');
const note=n=>n?`<p class="note mt-5"><b style="color:var(--a)">Importante:</b> ${E(n)}</p>`:'';
const blk=b=>b.k==='li'?`<p class="rule blk">${E(b.t)}</p>`:b.k==='b'?(b.t.length>95?`<p class="note blk my-3">${E(b.t)}</p>`:`<h4 class="hd font-bold mt-4 mb-2" style="color:var(--a)">${E(b.t)}</h4>`):`<p class="blk mb-2 leading-7 max-w-[72ch]" style="color:#ddd2d5">${E(b.t)}</p>`;
const cardx=c=>`<div class="cardx"${c.lv?` data-lv="${c.lv}"`:''}>${c.title?`<h3 class="hd font-extrabold text-lg mb-3">${E(c.title)}</h3>`:''}${c.blocks.map(blk).join('')}</div>`;
function section(s){
 let h=`<section id="${s.id}" class="sec glass p-6 sm:p-8 in"><h2 class="mb-5">${E(s.title)}</h2>`;
 if(s.text) h+=s.text.map(t=>`<p class="mb-3 leading-7 max-w-[72ch]" style="color:#ddd2d5">${E(t)}</p>`).join('');
 if(s.quote) h+=`<p class="note mt-4 italic">${E(s.quote)}</p>`;
 if(s.terms) h+=`<div class="grid sm:grid-cols-2 gap-3 mb-4">${s.terms.map(([a,b,c])=>`<div class="tile"><b>${E(a)}</b>${b?`<small>${E(b)}</small>`:''}<p class="text-[.93rem] leading-6">${E(c)}</p></div>`).join('')}</div>`;
 if(s.intro) h+=`<p class="mb-5 leading-7 max-w-[72ch]" style="color:#ddd2d5">${E(s.intro)}</p>`;
 if(s.items) h+=`<div class="grid gap-2.5">${rules(s.items)}</div>`;
 if(s.groups) h+=s.groups.map(g=>`<div class="mt-7"><h3 class="hd font-extrabold text-lg mb-3" style="color:var(--a)">${E(g.title)}</h3><div class="grid gap-2.5">${rules(g.items)}</div></div>`).join('');
 if(s.blocks) h+=s.blocks.map(blk).join('');
 if(s.cards) h+=`<div class="grid gap-4">${s.cards.map(cardx).join('')}</div>`;
 return h+note(s.note)+'</section>';
}
function render(){
 const k=DATA[location.hash.slice(1)]?location.hash.slice(1):'general', d=DATA[k];
 document.body.dataset.tab=k; $('#sub').textContent=d.sub; $('#q').value='';
 tabs.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
 const out=$('#out'), idx=$('#idx'); out.innerHTML=''; idx.innerHTML='';
 if(d.pending){
  out.innerHTML=`<section class="glass p-8 in"><h2 class="hd font-extrabold text-2xl mb-3">${E(d.label)}: próximamente</h2><p class="mb-5 max-w-[60ch] leading-7" style="color:#ddd2d5">Esta normativa se está terminando de redactar. Cuando se publique, aquí encontrarás:</p><div class="flex flex-wrap gap-2">${d.topics.map(t=>`<span class="chip">${E(t)}</span>`).join('')}</div></section>`;
 } else d.sections.forEach(s=>{out.insertAdjacentHTML('beforeend',section(s));idx.insertAdjacentHTML('beforeend',`<a href="#" data-s="${s.id}">${E(s.title)}</a>`)});
 idx.onclick=e=>{const a=e.target.closest('a'); if(a){e.preventDefault();document.getElementById(a.dataset.s).scrollIntoView()}};
 io&&io.disconnect(); io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){idx.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.s===x.target.id))}}),{rootMargin:'-20% 0px -70% 0px'});
 out.querySelectorAll('section[id]').forEach(s=>io.observe(s)); scrollTo(0,0);
}
$('#q').oninput=e=>{const v=e.target.value.toLowerCase().trim();
 document.querySelectorAll('#out section[id]').forEach(s=>{let any=!v;
  s.querySelectorAll('.rule,.tile,.blk').forEach(r=>{const m=!v||r.textContent.toLowerCase().includes(v);r.hidden=!m;any=any||m});
  s.hidden=!any})};
addEventListener('hashchange',render); render();
</script>
