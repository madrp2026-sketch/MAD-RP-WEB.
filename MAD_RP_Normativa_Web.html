<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAD RP · Normativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#060306;--a:#ff1a3c;--g:rgba(255,26,60,.28);--tx:#efe9ea;--mu:#a99ea1}
body[data-tab=policial]{--a:#2f7bff;--g:rgba(47,123,255,.3)}
body[data-tab=ems]{--a:#22d3ee;--g:rgba(34,211,238,.28)}
body[data-tab=delictivo]{--a:#ff4a1c;--g:rgba(255,74,28,.3)}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;transition:--a .3s}
h1,h2,h3,.hd{font-family:Montserrat,Inter,sans-serif}
.glass{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
.bar{background:rgba(6,3,6,.78);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
.tab{padding:.5rem .95rem;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--mu);white-space:nowrap;transition:.2s}
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff;background:var(--g);box-shadow:0 0 0 1px var(--a),0 0 22px var(--g)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.hero{position:relative;height:min(52vh,460px);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,rgba(6,3,6,.35) 55%,rgba(6,3,6,.6))}
.hero .t{position:absolute;left:0;right:0;bottom:1.6rem;z-index:2}
.hero img{animation:kb 26s ease-in-out infinite alternate;transform-origin:50% 40%}
@keyframes kb{from{transform:scale(1.04) translateX(-1.2%)}to{transform:scale(1.17) translateX(1.2%) translateY(-1.5%)}}
.hero:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(60% 70% at 55% 20%,rgba(255,40,60,.55),transparent 70%);opacity:0;animation:fl 9s linear infinite}
@keyframes fl{0%,62%,70%,100%{opacity:0}64%{opacity:.85}66%{opacity:.15}68%{opacity:.7}}
.logo{animation:fy 4.5s ease-in-out infinite,pu 2.6s ease-in-out infinite;transition:transform .3s}
.logo:hover{transform:rotate(-8deg) scale(1.12)}
@keyframes fy{0%,100%{translate:0 0;rotate:-3deg}50%{translate:0 -3px;rotate:3deg}}
@keyframes pu{0%,100%{box-shadow:0 0 0 2px var(--a),0 0 10px var(--g)}50%{box-shadow:0 0 0 2px var(--a),0 0 26px 4px var(--g)}}
.glow{text-shadow:0 0 28px var(--g)}
.idx a{display:block;padding:.4rem .8rem;border-left:2px solid rgba(255,255,255,.1);color:var(--mu);font-size:.9rem;transition:.2s}
.idx a:hover{color:#fff}
.idx a.on{color:#fff;border-color:var(--a);background:linear-gradient(90deg,var(--g),transparent)}
.sec h2{font-weight:800;font-size:clamp(1.4rem,3vw,1.9rem);letter-spacing:-.01em}
.sec h2:after{content:"";display:block;width:44px;height:3px;margin-top:.55rem;background:var(--a);box-shadow:0 0 14px var(--a);border-radius:3px}
.tile{padding:.95rem 1.05rem;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);transition:.2s}
.tile:hover{border-color:var(--a);box-shadow:0 0 24px -6px var(--g)}
.tile b{font-family:Montserrat;font-weight:800;font-size:1.25rem;color:var(--a)}
.tile small{display:block;color:var(--mu);font-size:.78rem;margin-bottom:.35rem}
.rule{position:relative;padding:.1rem 0 .1rem 1.35rem;line-height:1.6;max-width:72ch}
.rule:before{content:"";position:absolute;left:.15rem;top:.62rem;width:7px;height:7px;border-radius:2px;background:var(--a);box-shadow:0 0 10px var(--a)}
.note{border-left:3px solid var(--a);background:linear-gradient(90deg,var(--g),transparent 70%);padding:.9rem 1.1rem;border-radius:0 12px 12px 0;font-weight:500}
.chip{padding:.4rem .8rem;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:var(--mu);font-size:.85rem}
.cardx{padding:1.1rem 1.25rem;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
.cardx h3{color:#fff}.cardx[data-lv]{border-left:4px solid var(--c)}.cardx[data-lv] h3{color:var(--c)}
.cardx[data-lv="1"]{--c:#3ddc84}.cardx[data-lv="2"]{--c:#b7e34a}.cardx[data-lv="3"]{--c:#ffc233}.cardx[data-lv="4"]{--c:#ff8a1f}.cardx[data-lv="5"]{--c:#ff2d2d;box-shadow:0 0 28px -8px #ff2d2d}
.rule{margin-bottom:.5rem}.idx a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[hidden]{display:none!important}
.in{animation:in .6s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
const DATA={"general": {"label": "Reglamento general", "sub": "Las normas base de la ciudad: rol, convivencia, zonas seguras y reportes.", "sections": [{"id": "historia", "title": "Nuestra historia", "text": ["En la ciudad de MAD RP encontrarás oportunidades, decisiones y caminos por descubrir. Aquí cada persona puede construir su propia historia: emprender un negocio, formar una familia, trabajar, competir, explorar la ciudad o involucrarse en situaciones llenas de emoción. En MAD RP tendrás libertad para desarrollar tu personaje y vivir experiencias a tu manera, siempre respetando las normativas del servidor y a los demás jugadores."], "quote": "La libertad de jugar también implica responsabilidad: tus acciones deben mantener la interpretación y la convivencia dentro del rol. Antes de participar, conoce y respeta las normas de MAD RP."}, {"id": "normas", "title": "Normas básicas de roleplay", "terms": [["IC", "In Character", "Todo lo que tu personaje vive, sabe y hace dentro de la ciudad."], ["OOC", "Out Of Character", "Conversaciones o información ajenas al personaje y al rol."], ["MG", "MetaGaming", "Usar información obtenida fuera del juego para obtener ventajas dentro del rol."], ["PG", "PowerGaming", "Realizar acciones irreales o forzar situaciones que no serían posibles en la vida real."], ["RDM", "Random Deathmatch", "Agredir o eliminar a otro jugador sin motivo ni desarrollo de rol."], ["VDM", "Vehicle Deathmatch", "Utilizar un vehículo como arma para atropellar sin una situación de rol válida."], ["PK", "Player Kill", "Tras ser abatido, tu personaje olvida lo ocurrido en esa situación y no puede volver a ella."], ["CK", "Character Kill", "Muerte definitiva del personaje. Solo se aplica con aprobación del equipo administrativo."], ["PKT", "Player Kill Total", "Pérdida total de memoria sobre los hechos previos a tu muerte, según lo determine la administración."], ["NLR", "New Life Rule", "Después de morir empiezas una nueva vida: no recuerdas lo anterior ni regresas al lugar."], ["Fail RP", "Rol incorrecto", "Actuar de forma incoherente con el rol o con la realidad de tu personaje."], ["Combat Logging", "Desconexión en rol", "Desconectarse para evitar las consecuencias de una situación de rol."], ["Valora tu vida", "Instinto de supervivencia", "Actúa como lo haría una persona real ante un peligro y evita comportamientos suicidas sin sentido."]]}, {"id": "respeto-y-convivencia", "title": "Respeto y convivencia", "items": ["Se exige respeto hacia todos los usuarios.", "Se prohíbe el acoso, la discriminación y las amenazas fuera de rol.", "Los conflictos IC no justifican ataques OOC."], "note": null}, {"id": "desarrollo-del-rol", "title": "Desarrollo del rol", "items": ["Las acciones deben tener coherencia con la situación y el personaje.", "Se prohíbe forzar situaciones o resultados sobre otros jugadores.", "Todo rol debe respetar las normas generales del servidor."], "note": null}, {"id": "contenido-18", "title": "Contenido +18", "items": ["Las escenas +18 solo están permitidas siempre y cuando todos los participantes den su consentimiento.", "Se prohíbe imponer este tipo de situaciones a otros jugadores."], "note": null}, {"id": "uso-de-canales-y-comunicacion", "title": "Uso de canales y comunicación", "items": ["Los canales IC y OOC deberán utilizarse correctamente.", "Se prohíbe utilizar canales de comunicación para obtener información o ventajas indebidas dentro del rol."], "note": null}, {"id": "uso-debido-de-me-y-do", "title": "Uso debido de /me y /do", "terms": [["/me", null, "Describe acciones realizadas por el personaje."], ["/do", null, "Describe situaciones, detalles o elementos perceptibles del entorno."]], "items": ["Está prohibido utilizar estos comandos para imponer acciones o resultados sobre otros personajes."]}, {"id": "vestimenta-e-identificacion", "title": "Vestimenta e identificación", "items": ["Se permite utilizar cualquier tipo de vestimenta, sin restricciones de estilo, respetando las zonas seguras.", "Todo miembro de una organización deberá llevar obligatoriamente el chaleco oficial de su organización, del color de su banda, cuando participe en actividades o situaciones relacionadas con ella.", "Se prohíbe utilizar vestimenta que represente a una organización criminal ajena a la que perteneces."], "note": null}, {"id": "zonas-seguras", "title": "Zonas seguras", "intro": "Se consideran zonas seguras los lugares destinados a servicios, atención y actividades comerciales. Dentro de estas zonas queda prohibido realizar acciones que alteren la tranquilidad o interrumpan el desarrollo del rol.", "groups": [{"title": "Hospital", "items": ["Prohibido iniciar tiroteos o peleas.", "Prohibido secuestrar, robar o agredir a personas.", "Prohibido rematar o ejecutar jugadores.", "Prohibido acudir con la intención de provocar conflictos.", "Prohibido utilizar vehículos para atropellar personas.", "Prohibido bloquear entradas y salidas.", "Prohibido interrumpir la atención médica de manera intencionada."]}, {"title": "Negocios", "items": ["Prohibido iniciar tiroteos o enfrentamientos.", "Prohibido robar o secuestrar dentro de las instalaciones.", "Prohibido amenazar o agredir a clientes y empleados.", "Prohibido utilizar armas para intimidar sin una situación de rol válida.", "Prohibido bloquear las entradas y salidas.", "Prohibido provocar disturbios que impidan el funcionamiento del negocio."]}, {"title": "Departamento LSPD", "items": ["Prohibido iniciar tiroteos o enfrentamientos contra oficiales o civiles.", "Prohibido robar armas, equipamiento o vehículos policiales.", "Prohibido secuestrar o tomar rehenes dentro de las instalaciones.", "Prohibido ingresar para provocar o interrumpir las actividades policiales.", "Prohibido bloquear entradas, salidas o estacionamientos.", "Prohibido refugiarse en el departamento para escapar de una persecución.", "Prohibido utilizar las instalaciones para realizar actividades delictivas."]}, {"title": "Garajes", "items": ["Prohibido robar vehículos dentro de las instalaciones.", "Prohibido forzar vehículos o utilizar ganzúas para sustraerlos.", "Prohibido iniciar tiroteos o peleas.", "Prohibido secuestrar, robar o agredir a jugadores.", "Prohibido utilizar vehículos para atropellar o intimidar a otros jugadores.", "Prohibido bloquear los puntos de aparición y salida de vehículos.", "Prohibido esperar a jugadores con la intención de robarles o atacarlos.", "Prohibido utilizar el garaje para escapar de una persecución activa."]}, {"title": "Prohibiciones generales para todas las zonas", "items": ["Prohibido utilizar una zona segura para escapar de una situación de rol activa.", "Prohibido disparar desde el exterior hacia el interior de una zona segura.", "Prohibido realizar ventas de drogas o intercambios ilegales.", "Prohibido provocar a otros jugadores para iniciar enfrentamientos.", "Prohibido utilizar las zonas seguras para evitar las consecuencias de acciones delictivas."]}]}, {"id": "reportes-y-administracion", "title": "Reportes y administración", "items": ["Los jugadores deberán utilizar los canales de reportes establecidos para informar cualquier incumplimiento de la normativa.", "Los reportes deberán realizarse con respeto y aportar pruebas cuando sea posible.", "Está prohibido utilizar los reportes para molestar, amenazar o realizar falsas acusaciones contra otros jugadores.", "Las situaciones de rol no deberán interrumpirse para discutir conflictos; se deberá acudir a administración cuando sea necesario.", "Los jugadores deberán respetar las decisiones del equipo administrativo.", "Si un jugador no está de acuerdo con una sanción, podrá solicitar una revisión mediante los canales correspondientes.", "Está prohibido faltar al respeto, amenazar o acosar al equipo administrativo.", "La administración podrá solicitar pruebas o explicaciones a los involucrados para resolver un caso.", "Ningún jugador podrá utilizar su amistad, rango o influencia para evitar una sanción."], "note": "Toda sanción deberá estar respaldada por una infracción y podrá ser revisada si existen pruebas que justifiquen una apelación."}, {"id": "nombres-y-personajes", "title": "Nombres y personajes", "items": ["Todo jugador deberá utilizar un nombre y apellido apropiados para un entorno de roleplay.", "Está prohibido utilizar nombres de personajes famosos, celebridades o figuras ficticias.", "No se permiten nombres ofensivos, vulgares, discriminatorios o con intención de provocar.", "Está prohibido utilizar nombres que representen bromas, memes o palabras sin sentido.", "Cada personaje deberá mantener una identidad propia dentro del servidor."], "note": null}, {"id": "reinicios-y-desconexiones", "title": "Reinicios y desconexiones", "items": ["Cuando se anuncie un reinicio del servidor, los jugadores deberán prepararse para finalizar sus actividades y situaciones de rol.", "Está prohibido iniciar robos, secuestros, tiroteos o cualquier situación delictiva cuando falte poco tiempo para el reinicio.", "Si el servidor presenta una caída inesperada, los jugadores deberán esperar a que se restablezca el servicio.", "Si un jugador se desconecta por problemas de conexión durante una situación de rol, deberá regresar lo antes posible y continuar la situación cuando sea posible.", "Está prohibido desconectarse intencionalmente para evitar una muerte, detención, secuestro o cualquier consecuencia de rol.", "Si un jugador no puede regresar por problemas técnicos, deberá informar a la administración.", "Después de un reinicio, las situaciones de rol que quedaron pendientes deberán retomarse si la administración o los involucrados lo consideran necesario.", "Está prohibido aprovechar reinicios o caídas para obtener ventajas, escapar de situaciones o evitar pérdidas."], "note": "Las desconexiones intencionales para evadir situaciones de rol serán consideradas evasión de rol y podrán recibir sanciones."}, {"id": "abuso-de-mecanicas", "title": "Abuso de mecánicas", "items": ["Está prohibido aprovechar errores o fallos de los sistemas del servidor para obtener beneficios o ventajas.", "No se permite duplicar dinero, objetos, armas o cualquier recurso mediante errores del sistema.", "Está prohibido abusar de animaciones para evitar disparos, golpes, detenciones o interacciones de rol.", "No se permite utilizar mecánicas de juego para atravesar paredes, escapar de lugares o acceder a zonas no permitidas.", "Está prohibido aprovechar errores de vehículos para obtener ventajas durante persecuciones o enfrentamientos.", "No se permite utilizar acciones, comandos o sistemas del servidor de manera diferente a su función para obtener beneficios.", "Cualquier error encontrado deberá ser informado a la administración.", "Está prohibido ocultar o compartir métodos para explotar fallos del servidor."], "note": "Cualquier abuso de mecánicas podrá ser sancionado, independientemente de si el jugador obtuvo o no un beneficio económico."}, {"id": "compromiso", "title": "Compromiso MAD RP", "text": ["Al ingresar y permanecer en MAD RP, aceptas respetar este reglamento, las indicaciones del equipo administrativo y las normas de convivencia. La administración podrá revisar cada caso y aplicar las sanciones correspondientes. Juega con respeto, construye tu historia y ayuda a mantener una ciudad divertida para todos."], "quote": "Las definiciones de este reglamento son una guía breve. El equipo administrativo podrá aplicar las medidas correspondientes según la normativa vigente y el contexto de cada situación."}]}, "policial": {"label": "Normativa policial", "sub": "Cómo se interpreta y se ejerce el servicio policial en MAD RP.", "sections": [{"id": "s0-1-interpretaci-n-policia", "title": "1 - INTERPRETACIÓN POLICIAL", "blocks": [{"k": "p", "t": "Un policía siempre debe tener una correcta interpretación de su personaje, cosas como proteger y servir debe ser un lema que se aplique en el día a día."}, {"k": "p", "t": "Tener actitud troll en medio de procedimientos policiales se considera falta de interpretación, un policía puede divertirse con sus compañeros, pero no puede reflejar una actitud troll delante civiles peligrosos, abatidos o situaciones tales como secuestros, robos, ventas ilegales y similares."}, {"k": "p", "t": "Siempre se debe tener una actitud profesional mientras se esté en servicio."}, {"k": "p", "t": "Tener un correcto actuar hace parte de tener una óptima experiencia del rol policial, recordemos que es un videojuego, pero para disfrutar del rol debemos saber actuar en diferentes situaciones."}]}, {"id": "s1-2-fuera-de-servicio", "title": "2 - FUERA DE SERVICIO", "blocks": [{"k": "p", "t": "Todos los policías al salir de servicio deberán salir del servicio en la tableta y seguidamente del F7."}, {"k": "p", "t": "Los policías que salgan de servicio se tendrán que mover de comisaría ya sin uniforme y sin armas u objetos de policía/vehículos de policía y desconectarse ya sea en GC o en alguna casa de ustedes."}, {"k": "p", "t": "Tengan en claro que cualquier persona que salga de servicio y lleve encima cualquier ítem de comisaría será sancionado severamente."}, {"k": "p", "t": "Tendrán un garaje en comisaría para que cuando vayan a salir de servicio saquen un vehículo personal y se trasladen a donde se van a desconectar."}]}, {"id": "s2-3-corrupci-n", "title": "3 – CORRUPCIÓN", "blocks": [{"k": "p", "t": "Un policía tiene permitido ser corrupto (Si es captado IC por otro policía o tengan pruebas contundentes será despedido de la policía)."}, {"k": "b", "t": "Está totalmente prohibido traficar con:"}, {"k": "li", "t": "El armamento de la institución y/o comisaría."}, {"k": "li", "t": "Los documentos obtenidos en la labor policial."}, {"k": "li", "t": "Si es descubierto practicando la corrupción, será llevado a perpetua (CK)."}]}, {"id": "s3-4-objetos-y-veh-culos", "title": "4 - OBJETOS Y VEHÍCULOS", "blocks": [{"k": "p", "t": "Si un policía pone objetos como conos, pinchos y demás, está en la obligación de retirarlos al finalizar el procedimiento (Si se perdió el rol y aparecen en hospital es obligatorio ir a retirarlas). Un policía no puede usar las patrullas policiales mientras está fuera de servicio. Está prohibido dejar patrullas abandonadas en la calle. Se debe incautar el auto. (Quien deje patrullas será sancionado)."}]}, {"id": "s4-5-uso-de-radio", "title": "5 - USO DE RADIO", "blocks": [{"k": "p", "t": "Todo oficial que tenga el trabajo activo tiene que estar obligatoriamente en radio. La gente que se quede AFK será acreedora a una sanción administrativa. Al entrar a radio, se anuncia que está en esperando asignación, para que el H50 en ese momento sea quien te asigne. La radio siempre tiene que estar limpia y se tienen que comunicar en su radio interna o si es sumamente necesario a todas las radios. Si alguien anuncia MODOCHARLIE todos los oficiales deben guardar silencio en ese momento para escuchar indicaciones o simplemente para limpiar la radio."}]}, {"id": "s5-6-cuando-se-puede-abrir-", "title": "6 - CUANDO SE PUEDE ABRIR FUEGO", "blocks": [{"k": "p", "t": "En tiroteos o persecuciones está prohibido como policía disparar primero, siempre se debe disparar en respuesta. Todo para mantener sana y salvo al resto de los ciudadanos. Cabe aclarar que luego de advertir repetidas veces a un civil y este hacer caso omiso al llamado se puede neutralizar. Si el civil tiene arma de fuego visible automáticamente se le puede abrir fuego. Si el civil tiene armas blancas y hace caso omiso a los 3 llamados, se le puede neutralizar con taser."}, {"k": "b", "t": "ES OBLIGATORIO CARGAR ARMA NO LETAL CONSIGO."}]}, {"id": "s6-7-persecuciones", "title": "7 – PERSECUCIONES", "blocks": [{"k": "p", "t": "Cuando empiezas una persecución debes anunciar por radio:"}, {"k": "p", "t": "Informó a H50 (tu radio, ejemplo, TAC 01) inició persecución a (descripción del auto) en dirección a (lugares conocidos como: GC, Comisaría, hospital, garaje rojo, etc.) Para poder activar código 100 y código PIT es necesario que hayan pasado 45 segundos iniciada la persecución dando avisos cada 15 segundos con el megáfono."}, {"k": "p", "t": "Si no se logra inutilizar el auto durante 2 minutos, se puede utilizar la clave robert (pinchar ruedas)."}]}, {"id": "s7-8-actitudes-de-polic-a", "title": "8 - ACTITUDES DE POLICÍA", "blocks": [{"k": "p", "t": "Antes de llevar a la cárcel o comisaría al detenido, es importante leer sus derechos. El detenido podría exigir su libertad o denunciar al oficial. Si un ciudadano pide identificación a un policía, el oficial debe darle su número de placa y rango. Cuando se detenga a un civil (Esto por un motivo razonable) el policía debe pedir su DNI para poder identificarlo. Los policías jamás deben responder irrespeto con irrespeto, si el arrestado tiene un mal vocabulario se le puede reprender y/o multar por insultar a un oficial. Siempre mantener la radio actualizada con información importante, abstenerse a dar datos innecesarios o que no contribuyen al equipo. Siempre que se esté en servicio, el oficial debe portar el armamento que se le proporcionó, tiene prohibido usar armamento diferente al entregado."}]}, {"id": "s8-9-zonas-seguras", "title": "9 - ZONAS SEGURAS", "blocks": [{"k": "p", "t": "Los policías tienen prohibido arrestar a alguien en una zona segura como: Garajes, Hospital, etc. Ojo, hay excepciones, ejemplo: Un empleado del UwU mediante el botón de pánico, /gov o entorno te pide que acudas porque hay personas con armas en el local, en dado caso puedes actuar."}]}, {"id": "s9-10-multipersonajes", "title": "10 – MULTIPERSONAJES", "blocks": [{"k": "p", "t": "A partir de ahora si quieres ser oficial de policía y tienes PJ delictivo al mismo tiempo con el uso del multipersonaje, será decisión de los altos mandos si te aceptan o no. Esto con la consecuencia de que se les tendrá más vigilados."}]}, {"id": "s10-11-trato-al-cuerpo-m-dic", "title": "11 - TRATO AL CUERPO MÉDICO (EMS)", "blocks": [{"k": "p", "t": "Los EMS son una de las facciones más importantes en cualquier servidor ya que se encargan de salvar nuestras vidas en algunas situaciones. Para hacer un llamado al EMS, se amerita usar el comando /auxilio especificando la zona y los heridos, acompañado de un /gov para que sepa que es la policía y si es zona segura. Si el EMS no da pronta respuesta se procede a preguntar OJO, A PREGUNTAR en su radio y solo puede hacerlo el más alto rango o el H50 en ese momento, en dado que el mismo esté abatido solo puede ir 1 oficial a su radio. De esta forma puedes preguntar si está disponible para atender al llamado de la policía."}, {"k": "p", "t": "Importante: No se puede pedir una reanimación de emergencia (excepciones para los policías para no perder armamento, etc.) Pero para el bando contrario está completamente prohibido hacerlo."}, {"k": "b", "t": "Si tiran de E evadiendo el rol del EMS es sanción administrativa hacia ese usuario."}]}, {"id": "s11-12-policia-transito", "title": "12 - POLICIA TRANSITO", "blocks": [{"k": "b", "t": "UNIFORME"}, {"k": "li", "t": "Uso de ropa asignada."}, {"k": "li", "t": "No se permite el uso de chaleco ni casco."}, {"k": "b", "t": "VEHÍCULOS"}, {"k": "li", "t": "Uso exclusivo de los vehículos designados para la función de tránsito."}, {"k": "li", "t": "Cualquier otro vehículo no designado será acreedor de sanción."}, {"k": "b", "t": "FUNCIONES"}, {"k": "li", "t": "Imposición de multas."}, {"k": "li", "t": "Educación vial."}, {"k": "li", "t": "Patrullaje en áreas asignadas."}, {"k": "b", "t": "ROL PASIVO"}, {"k": "li", "t": "No se debe intervenir en situaciones de tiroteo o en roles de alta conflictividad."}, {"k": "li", "t": "No cateo a individuos."}, {"k": "li", "t": "No arrestos, detenciones de individuos."}, {"k": "b", "t": "ROL AGRESIVO"}, {"k": "li", "t": "Se permite la asistencia únicamente en caso QRR."}, {"k": "li", "t": "En situaciones de rol agresivo, el uso de chaleco es obligatorio."}]}, {"id": "s12-13-investigaciones", "title": "13 – Investigaciones", "blocks": [{"k": "p", "t": "Para poder realizar investigaciones sobres usuarios u organizaciones, deben tener un motivo importante para empezar la misma."}, {"k": "p", "t": "(Detener vehículos o personas con una gran cantidad de droga, armas. Haber realizado un CK algún policía y que sepan quien fue, etc.)"}, {"k": "p", "t": "Para empezar la investigación tendrán que levantar ticket para que el STAFF de autorización de que realice la investigación."}]}, {"id": "s13-14-qrr-y-10-20", "title": "14 - QRR Y 10-20", "blocks": [{"k": "p", "t": "El botón de QRR NO se usa cuando estamos en peligro común, solo se usa cuando estés en peligro real."}, {"k": "p", "t": "En casos de secuestros sin/con disparos en medio solo se anuncia \"QRR\". QRR es agente en peligro."}, {"k": "p", "t": "Anunciar código QRR mientras estás siendo reducido cuenta como no valorar tu vida."}, {"k": "p", "t": "Presionar el botón QRR mientras te apuntan cuenta como no valorar tu vida."}, {"k": "p", "t": "Presionar el QRR aun teniendo las comunicaciones cortadas acata una sanción administrativa."}, {"k": "p", "t": "El botón de QRR no se podrá usar cuando estamos muertos. El botón de pánico se encuentra en la radio, en caso de ser quitada las comunicaciones también se quitará el botón."}, {"k": "p", "t": "Es totalmente obligatorio y necesario que todas las unidades policiales activas, asistan a un botón de pánico presionado por un policía."}, {"k": "p", "t": "El botón de 10-20 solo se usa para dar la ubicación en cualquier momento que se solicite, se necesite, etc."}, {"k": "p", "t": "El botón de 10-20 no se podrá usar cuando estamos muertos."}]}, {"id": "s14-15-uso-de-helic-ptero", "title": "15 – Uso de helicóptero", "blocks": [{"k": "p", "t": "El uso de helicóptero lo podrán ocupar para apoyo en cualquier rol y podrán disparar desde este, siempre y cuando sea la última opción."}, {"k": "p", "t": "En roles de robos con DEFCON 3 solo se podrá usar un helicóptero ( Los tripulantes del helicóptero cuentan como integrantes del rol )."}, {"k": "p", "t": "El helicóptero nunca podrá iniciar roles, esté siempre servirá como apoyo a las unidades de tierra ( Si el helicóptero en patrullaje ve algo sospechoso tendrá que solicitar apoyo a unidades de tierra )."}, {"k": "b", "t": "El uso de máscara solo será para cubrir boca y nariz."}]}, {"id": "s15-reglamento-secci-n-alert", "title": "Reglamento Sección Alertas Policía", "blocks": [{"k": "p", "t": "Tienen como protocolo hacer 3 avisos para que el usuario se detenga."}, {"k": "p", "t": "Solo los policías involucrados en la persecución (o rol) podrán mandar los avisos por GOV, si son policías no involucrados serán sancionados."}, {"k": "li", "t": "Las alertas tomarán 45 Segundos (15 entre cada aviso) si después de 45 segundos el usuario no acata órdenes, la policía puede aplicar maniobra pit o bloqueos para inutilizar el vehículo."}, {"k": "li", "t": "Si después de un rato en persecución la policía no logra inutilizar al vehículo, podrá disparar a llantas (1 minuto )."}, {"k": "li", "t": "Si la policía pierde a los que estaba persiguiendo, el delictivo por anónimo tendrá que solicitar GG con la policía para finalizar la persecución tendrá 6 minutos para darlo."}]}, {"id": "s16-enfoque-a-persecuciones-", "title": "ENFOQUE A PERSECUCIONES Y ALERTAS", "blocks": [{"k": "li", "t": "Desde ahora no podemos disparar en ningún momento relacionado a huidas y persecuciones hasta recibir la última alerta (3er aviso) donde la policía tiene permitido disparar, ESTO PARA GENERAR UN FAIRPLAY en las mismas condiciones y el rol de persecución se ejecute mejor y dure mas."}, {"k": "p", "t": "Ejemplo: si recibo 2 alertas de pararme"}]}, {"id": "s17-zonas-seguras", "title": "ZONAS SEGURAS", "blocks": [{"k": "p", "t": "Los policías tienen prohibido arrestar a alguien en una zona segura como:"}, {"k": "li", "t": "Garages"}, {"k": "li", "t": "Hospital"}, {"k": "p", "t": "Básicamente lugares donde sean recreativos o de chill Ojo, hay excepciones, ejemplo: Un empleado del UwU mediante el botón de pánico, /gov o entorno te pide que acudas porque hay personas con armas en el local, en dado caso puedes actuar. Otro ejemplo es en tema de robo o persecución que el delictivo o user que escapa de la policía entra en una zona segura para escudarse en este punto LA POLICÍA PUEDE ARRESTARLOS PARA SACARLOS DE ZONA SEGURA, se considera evasión de rol por ende la policia podra hacer esto para seguir el rol o si prefiere reportarlo al instante de que pase."}]}, {"id": "s18-regla-conforme-tiempo-en", "title": "REGLA CONFORME TIEMPO EN ROBOS", "blocks": [{"k": "li", "t": "Si estamos en un robo el límite de espera serán 40 MINUTOS para que alguien avance"}, {"k": "li", "t": "El que tenga la mayoría activa de unidades o usuarios en el robo deberá empujar alcanzando el tiempo límite."}]}, {"id": "s19-regla-conforme-complemen", "title": "REGLA CONFORME COMPLEMENTOS", "blocks": [{"k": "p", "t": "El uso de dardos rastreadores por parte de la policia sera de la siguiente manera:"}, {"k": "li", "t": "Defcon 1 a 3 (uso de 1 dardo)."}, {"k": "li", "t": "Defcon 4 A 5 (uso de 2 dardos)."}, {"k": "p", "t": "Estos dardos trackearan a la persona si logran conectar a los autos del bando delictivo, dando la ubicación con un tiempo estimado de 5 minutos cada 10 segundos avisando donde van en tiempo real."}, {"k": "p", "t": "El uso de este item es prácticamente para persecuciones de ROBOS GENERALES, no persecuciones de entorno asaltos etc etc.siendo delictivo no puedo accionar contra los policías, hasta recibir el 3er anunció el policía tiene permitido disparar entonces en ese punto DE LA PERSECUCIÓN podremos disparar en contra de ellos y ellos contra nosotros NO ANTES ESTO CONLLEVA UNA SANCIÓN."}, {"k": "p", "t": "Si tu decides llevarlos a un topon o zona donde quedes atrapado en ese punto no aplica estas reglas, pues ahí ya se fomenta un rol agresivo a pie y no se mantiene una persecución en vehículo o huida."}]}, {"id": "s20-enfoque-a-persecuciones-", "title": "ENFOQUE A PERSECUCIONES Y AVISOS", "blocks": [{"k": "li", "t": "Desde hoy no se puede disparar en ningún momento estando en temas de persecución o huidas de robo"}, {"k": "li", "t": "Se podrá efectuar disparos para frenarlos o ponchar etc... solo cuando la policía esté en las mismas condiciones (recibir 3 alertas y ahi podrán dispararse si se mantiene en persecución o huida en automóviles etc no a pie)"}, {"k": "li", "t": "Ejemplo: Si yo como delictivo me han mandado la 2da alerta de pararme deber seguir en persecución y esperar hasta que me intenten descontrolar con la maniobra pit que si ellos fallan ahora pueden dispararme"}, {"k": "li", "t": "Esto aplica para temas de rol en movimiento ( persecución activa o huida de un robo) para nivelar o generar el FAIRPLAY en esta situación."}, {"k": "li", "t": "Estas reglas no aplican si deciden pararse entre avisos en zonas y protegerse entre casas etc donde ya pasa de persecución en auto a rol agresivo a pie donde ya ambos estarían en las mismas condiciones"}, {"k": "li", "t": "Cuando un rol pasa de persecución a pie, deberán seguirlo así o hasta que se mueva, EJEMPLO bajarnos del auto ponchar a los policías y volver a subir al auto para escapar si ya pasamos de uno a otro sería romper el fairplay."}, {"k": "p", "t": "En casos de persecuciones que pasen a canales ríos o mares: la policía podrá disparar directamente a abatir a los delictivos pues en la situación la policía no está lista para actuar rápido si la idea delictiva como ejemplo es escapar por el mar con una lancha etc esperándolos, si esto llega a pasar la policía podrá accionar directamente a abatir a los delictivos."}]}]}, "ems": {"label": "Normativa EMS", "sub": "Las reglas del servicio médico y de emergencias.", "sections": [{"id": "s0-1-el-ems-no-es-un-objeti", "title": "1 - El EMS No Es un Objetivo de Disparos", "blocks": [{"k": "li", "t": "Los EMS son fundamentales en el servidor, sin ellos, nadie puede mantener su vida o actividades en funcionamiento."}, {"k": "li", "t": "Se les pide a todos los usuarios que respeten a los EMS en todo momento. Estos profesionales de la salud tendrán una vestimenta distintiva para que sean fácilmente identificables. En términos de rol, deben ser considerados \"a prueba de balas\"."}, {"k": "li", "t": "Si un EMS tiene una actitud negativa o inapropiada hacia los usuarios, repórtalo inmediatamente a través de un ticket en el Discord del servidor juntos con pruebas de lo sucedido."}, {"k": "li", "t": "Los EMS están obligados a obedecer las órdenes sin resistencia en situaciones de amenaza."}, {"k": "li", "t": "No se debe disparar a los EMS antes o después de que se les dé una orden. Cualquier agresión hacia un EMS será considerada una violación grave de las normas del servidor."}, {"k": "li", "t": "Los EMS deben valorar su vida en todo momento."}, {"k": "li", "t": "Si un EMS ignora las advertencias de retirarse de una zona insegura y continúa reanimando a personas en un área peligrosa, se considera que no está valorando su vida, y los jugadores pueden abatir al EMS solo en estas circunstancias específicas."}]}, {"id": "s1-2-si-no-roleas-con-el-m-", "title": "2 - Si no roleas con el médico los /me y /do esto producirá un CK directo", "blocks": [{"k": "li", "t": "Esto es importante a leer cuando nos despeguemos del pc por estar muertos y llega el médico tenga en cuenta que si no contestan al médico él podrá reportar un CK por evasión de rol."}, {"k": "li", "t": "Sin pruebas como ese ejemplo de arriba procederemos a eliminar a tu personaje por: evasión al médico."}, {"k": "li", "t": "Roleen bien para eso, es cuando están atendiéndolos de lo contrario recibirán sanción directa si solo andan usando los me y do mal."}]}, {"id": "s2-3-los-ems-no-pueden-entr", "title": "3 - LOS EMS NO PUEDEN ENTRAR A ZONAS ROJAS/FARMEO", "blocks": [{"k": "li", "t": "No deben seguir órdenes que los lleven a estas áreas. Solo se permite atender emergencias a una distancia mínima de 200 metros fuera de la zona caliente."}]}, {"id": "s3-4-regla-para-temas-de-re", "title": "4 - REGLA PARA TEMAS DE REANIMACIÓN", "blocks": [{"k": "li", "t": "El tiempo total para una muerte es de 16 minutos, si durante el lapso de este mismo el EMS llega y ya inició rol contigo y le respondes ya no hay vuelta atrás por ende si tiras de la E mientras está el rol acreditas para un CK, si se te está acabando el tiempo avísale por /ooc que te queda tanto tiempo, de preferencia dale el aviso de al menos 30 segundos antes de morir por completo."}, {"k": "li", "t": "Si estás en una zona abatido después de un rol agresivo, y hay demasiados abatidos debes esperar tu turno, en caso de que se te vaya a acabar el tiempo deberás avisar o esperar a que se te acabe el tiempo."}, {"k": "li", "t": "Los EMS tienen alertas en todo momento por lo tanto se les pide que sean pacientes el EMS atenderá conforme hayan llegado las alertas."}]}]}, "delictivo": {"label": "Reglamento delictivo", "sub": "Reglas para bandas, robos y conflictos: el lado rojo de la ciudad.", "sections": [{"id": "s0-reglamento-roles-pasivos", "title": "Reglamento Roles Pasivos Y Agresivo", "cards": [{"title": "1 - Entornos Correctos", "blocks": [{"k": "li", "t": "El uso del /entorno en ventas de drogas será opcional y permitirá informar cuántas personas participan, para que la respuesta policial sea proporcional."}, {"k": "li", "t": "Debes especificar lo siguiente: cantidad de personas, cantidad de autos y color, ropa si es posible cualquier cosa que vean conforme la actividad que hacen y demás."}, {"k": "li", "t": "Para entornos de drogas está prohibido hacer las ventas en zonas que marquen seguras de cualquier tipo, esto conlleva una sanción."}, {"k": "b", "t": "Ejemplo:"}, {"k": "p", "t": "Si se reportan 2 vendedores, podrán acudir 2 oficiales a la zona, evitando que toda la comisaría responda al mismo aviso."}], "lv": null}, {"title": "2 - Roles Pasivos ( NO CONFLICTOS )", "blocks": [{"k": "li", "t": "Un rol pasivo es una interacción en la cual no involucra disparos, queda prohibido cualquier tipo de escalada de un rol pasivo a uno agresivo será sanción directa."}, {"k": "b", "t": "Por ejemplo:"}, {"k": "p", "t": "Una parada de tráfico y termina en balacera, Una fiesta y que llegue un grupo a hacer alboroto y disparar, etc."}], "lv": null}, {"title": "3 - Actitudes forzadas", "blocks": [{"k": "li", "t": "Esto se refiere a forzar rol con cualquier organización delictiva, policial o a civiles y nos tienen en clip, se te dará sanción."}, {"k": "li", "t": "Ejemplo de forzar rol: Ver una patrulla e ir derrapar enfrente o insultarlos solo para que te sigan y que acaba en tiroteo. Eso sería un claro ejemplo de forzar el rol."}], "lv": null}, {"title": "4 - Regla del abuso de la mira de punto rojo", "blocks": [{"k": "li", "t": "Cualquier mal uso de la función default de GTAV del apuntado para ubicar gente escondida en arbustos o algún tipo de objeto que bloquee visión y usen el punto rojo para ubicarlo serán gravemente sancionados."}], "lv": null}, {"title": "5 - Enfoque a roles agresivos en ciudad o norte", "blocks": [{"k": "li", "t": "Está completamente prohibido regresar al rol agresivo donde fuiste abatido. La única manera de poder regresar es que no te hayas muerto y solo sería para lotear si te falto algo o llevarte abatidos de tu bando."}, {"k": "li", "t": "No te puedes quedar para campear cuerpos, policía, etc. Debe ser una huida rápida."}, {"k": "li", "t": "Si comienzan un robo o persecución, huida limpia, etc. en ciudad se tendrá que respetar la defcon con la que se comienza, si se ve las intenciones de ir al norte para usar un defcon más alto será sancionable, al igual si se dirigen alguna zona roja será prohibido."}, {"k": "b", "t": "Ejemplo:"}, {"k": "p", "t": "En un rol de venta de droga se enfrentan dos organizaciones y solo quedan 2 personas de una organización, estos tendrán que priorizar llevarse lo más que puedan en tema de loot y sus compañeros, si llega la policía lo mismo, tratar de huir con compañeros y loot."}], "lv": null}, {"title": "6 - Rol agresivo", "blocks": [{"k": "li", "t": "Las bandas y delincuentes en ciudad podrán únicamente iniciar roles agresivos no mayor a 10 personas portando obligatoriamente la misma vestimenta y vehículo del mismo color. Todo esto deberá ser escrito en el entorno y las personas que pongan en el mismo son las únicas, no se podrán agregar más personas al rol."}, {"k": "b", "t": "Ejemplo:"}, {"k": "p", "t": "Estoy viendo una camioneta gris con 3 personas y 2 personas más en una moto gris, al parecer vendiendo droga, por favor vengan rápido tienen pistolas al parecer semi automáticas en mano."}, {"k": "li", "t": "Si en el rol agresivo abaten a todos los contrarios y llega el EMS, tienen que comentarle al EMS que no los reviva si es que quieren sacar cualquier tipo de información, robar cosas, etc. Esto porque si el EMS llega a revivir a uno de los del otro bando ya no se podrá hacer ninguna acción sobre esta persona que la revivieron."}, {"k": "li", "t": "Cualquier tipo de insulto, toxicidad, burla, etc. se le dará un ban de 3 días, incluso si la otra parte hizo el rol mal, no se justifica que tomen estas actitudes. Si este tipo de acciones son seguidas se incrementará la sanción hasta un ban inapelable."}], "lv": null}, {"title": "7 - Valoración de vida", "blocks": [{"k": "p", "t": "Ustedes como usuarios deberán valorar la vida en cualquier situación, ya sea de criminales o policías, al no acatar la orden de valorar vida de ti o terceras personas dependiendo de la situación puede procederse con un CK directo en este caso un CLIP extenso."}, {"k": "b", "t": "Ejemplo donde no aplica un CK directo sería:"}, {"k": "p", "t": "La situación comienza con un enfrentamiento entre dos grupos: un grupo de 7 personas y otro de 6."}, {"k": "b", "t": "Inicio de la interacción:"}, {"k": "li", "t": "El grupo de 7 personas detiene a 3 del grupo contrario."}, {"k": "li", "t": "Dos de los 7 se quedan cateando (revisando) a los 3 detenidos."}, {"k": "li", "t": "Los otros 5 del grupo de 7 se alejan entre 100 y 200 metros para vigilar y evitar que los otros 3 (del equipo de 6) lleguen a ayudar."}, {"k": "b", "t": "Error de los criminales:"}, {"k": "li", "t": "Mientras revisaban a los 3 detenidos, los 2 cateadores descuidan a uno de ellos."}, {"k": "li", "t": "No lo esposan ni lo vigilan, a pesar de que tiene armas."}, {"k": "b", "t": "Contraataque:"}, {"k": "li", "t": "El individuo libre aprovecha la oportunidad, saca su arma y mata a los 2 que estaban cateando."}, {"k": "b", "t": "Cambio en la situación:"}, {"k": "li", "t": "Lo que era un enfrentamiento de 7 vs 3 (ya que 3 del grupo de 6 estaban detenidos)"}, {"k": "li", "t": "Se convirtió en un 3 vs 2, ya que el detenido libre eliminó a los 2 cateadores."}, {"k": "p", "t": "Conclusión: La mala organización del grupo de 7 les costó la ventaja. No aseguraron correctamente a los detenidos y permitieron que uno de ellos tomara represalias, volteando la situación a favor del grupo contrario."}], "lv": null}, {"title": "8 - Territorios", "blocks": [{"k": "li", "t": "Obligatorio estar de la misma vestimenta conforme a su banda si estarán en captura/defensa de territorios."}, {"k": "li", "t": "Pueden usar cualquier tipo de autos ( Respetando el color de banda al igual que el defcon que está situado en la zona )."}, {"k": "li", "t": "Territorios de droga funcionan como defcon 5."}], "lv": null}, {"title": "9 - Alianzas", "blocks": [{"k": "p", "t": "Ya no está permitido ningún tipo de alianza entre bandas de por medio, por lo que no se pueden ayudar en ningún rol agresivo a menos que sea una actividad de robo en conjunto, donde se sorprenda que algún integrante está roleando con otra organización y de otro color será acreedor de una sanción ban o ck."}], "lv": null}, {"title": "10 - ENFOQUE ENFRENTAMIENTOS", "blocks": [{"k": "li", "t": "Si existe enfrentamientos de bandas que suceden naturalmente, la policía podrá llegar como es habitual opcional mandar un /entorno acorde la situación para que exista el fairplay, sino se manda un /entorno aclarando cuantos hay podrá acudir toda la policía disponible."}, {"k": "b", "t": "Obligatorio para policías ir con parlantes y las sirenas cuando acudan a múltiples alertas de disparo, pues ayudará a distinguir cuando están cerca de la zona de enfrentamiento y solo podrán disparar a sujetos con arma visible."}], "lv": null}, {"title": "11 - REGLA DE COMUNICACIÓN", "blocks": [{"k": "li", "t": "El uso del radio es obligatorio para comunicaciones IN GAME"}, {"k": "li", "t": "El usar discord es sanción directa para el grupo o persona involucrada en un reporte"}, {"k": "li", "t": "Se considera MG, esta regla es de oro y no escrita pero por motivos que últimamente han aparecido constantemente se aclara en una regla firme."}], "lv": null}, {"title": "12 - ROLES AGRESIVOS A CIVILES O DELICTIVOS", "blocks": [{"k": "li", "t": "Se tendrá que mandar los 3 anuncios cada 15 seg. ( /Anon ) para que se detengan, a partir del 3er anuncio estará permitido disparar solo a ponchar llantas para inutilizar el vehículo en el que venga."}, {"k": "li", "t": "Tienen que estar atentos a los /Anon que se mandan, si les mandan un anónimo a ustedes y se meten a zona segura diciendo que no se dieron cuenta, no vieron, etc. Se les dará una sanción, por lo que pedimos que estén atentos a estos msj."}], "lv": null}, {"title": "13 - ROLES AGRESIVOS A POLICÍAS", "blocks": [{"k": "li", "t": "Cualquier tipo de rol hacía policía no se tendrá que mandar ningún anuncio pero tendrán que actuar de manera rápida para levantarlos o robarlos dependiendo la situación ( Tiempo estimado menos de 5 min ) , esto implica mandar /entorno bien aclarado para proceder en temas de negociación."}, {"k": "li", "t": "Si la policía no coopera y hace tiempo para que lleguen compañeros o para que pase el tiempo de los 5 min, se les dará sanción de baneo dependiendo de como se llevó la situación de rol."}, {"k": "li", "t": "Si la policía llega antes de que termine el robo tendrán que negociar la vida del oficial o si deciden huir tendrán que dejar vivo al oficial ( La negociación se tendrá que llevar a cabo en un canal de radio proporcionado por los policías ) ."}], "lv": null}, {"title": "14 - ABUSO DE TRABAJOS", "blocks": [{"k": "p", "t": "Todo aquel que sea sorprendido usando mal un job será acreedor de un ban directo."}, {"k": "b", "t": "EJEMPLO:"}, {"k": "p", "t": "En un rol de persecución se daña mi vehículo pero estoy como delictivo y me aprovecho que tengo el trabajo de mecánico solo para repararlo y poder huir en vez de llevar un kit de reparación. si se capta este acto de aprovecharse serán baneados directamente sin apelaciones."}], "lv": null}]}, {"id": "s1-reglamento-de-robos-user", "title": "Reglamento De Robos ( USERS )", "cards": [{"title": "1 - ROBO A CIVILES", "blocks": [{"k": "p", "t": "Puedes robar a civiles con 1 policía en servicio activo, sólo podrás robar lo que lleva encima, no puedes forzar a que te den dinero de cajeros, robar la casa del usuario o sacar un vehículo del garaje para robar cosas de este. No pueden robar comida y agua, tampoco ítems de trabajo siempre se tendrá que mandar chismosa ( /entorno ) en el momento que lo asalten."}, {"k": "p", "t": "Robar civiles es rápido, no es un rol para forzar a la policía a llegar y balear, se prioriza la huida, así que tiene que ser rápido este rol. Si el usuario no coopera podrán matarlo."}, {"k": "b", "t": "Ejemplo:"}, {"k": "p", "t": "Intentan secuestrar a 2 civiles entonces solo podrán ir 3, si se ve que van más de lo habitual termina siendo sanción directa a la organización o grupo."}], "lv": null}, {"title": "2 - ROBO A POLICÍAS", "blocks": [{"k": "p", "t": "Solo se podrá robar a Policías si hay 3 Oficiales en servicio activo. Esto no incluye al que estén robando. Los policías en el robo deberán valorar la vida si están en desventaja, deberán cooperar en todo momento y debe ser rápido, priorizar la huida. En este caso si los delincuentes descuidan al policía, éste podrá utilizar su arma en contra de ellos. Está prohibido ROBAR Ítems de trabajo ( Armamento de fuego puede ser robado mas no usado porque son armas exclusivas de la policía, la única manera de poder usarla es que se hayan quedado sin balas o se rompe su arma en el mismo rol ) Prohibido Robar Ítems De Trabajo En Cajuelas O Autos De Policía ( Armamento de fuego puede ser robado mas no usado ) Puedes robar y usar las patrullas, SÓLO SI HAN GANADO EL ROL ( solamente para alejarte de la zona y después desecharla ) No pueden robar a gente en sus zonas de trabajo ( Aplica para trabajos principales y secundarios )."}, {"k": "p", "t": "Ejemplo: si hay algún camionero trabajando no podemos robarlo porque sí."}], "lv": null}, {"title": "3 - SECUESTROS (General)", "blocks": [{"k": "li", "t": "Para secuestrar a un civil se ocupan 3 Policías En Servicio Activo."}, {"k": "li", "t": "Para secuestrar a un policía se ocupan 5 Policías En Servicio Activo, esto sin contar al secuestrado."}, {"k": "li", "t": "Solo está permitido ir 1+ de los que van a secuestrar"}, {"k": "li", "t": "Los EMS cuentan con inmunidad, no podrán ser secuestrados en horarios laborales."}, {"k": "b", "t": "Precios para solicitar una recompensa por secuestro:"}, {"k": "li", "t": "Civil: $100K a $150K"}, {"k": "li", "t": "Integrante De Facción: $250K a $350K"}, {"k": "li", "t": "Si hay 1 secuestro en curso deberán esperar 1 hora para ejecutar un nuevo secuestro."}, {"k": "li", "t": "El rol de secuestro tiene un tiempo de respuesta máximo de 30 minutos entre ambas organizaciones ( legal e ilegal ) para negociaciones pues algunos están ocupados en otras actividades tratemos de apurarlos."}, {"k": "li", "t": "Cuidadito con no respetar la vida del sujeto secuestrado, no rompan esta normativa para pvpear rápidamente al llevar a la zona de negociación."}, {"k": "li", "t": "Y pues controlen el tema de secuestro pues es un rol enfocado a negociar por su vida no significa que podemos secuestrar a diestra y siniestra a los usuarios, usenlos para beneficio de robos, dinero y así, pero tampoco para arruinar la experiencia del usuario por mucho tiempo."}], "lv": null}]}, {"id": "s2-reglamento-de-robos-gene", "title": "Reglamento De Robos ( GENERAL )", "cards": [{"title": "1 - Refuerzos", "blocks": [{"k": "li", "t": "No habrá refuerzos en robos en curso a menos…"}, {"k": "li", "t": "Al romper la negociación de un lado, el otro lado avisará que se han roto negociaciones, entonces ahora el lado que no rompió la negociación podrá pedir refuerzos limitado a 3 máximo si es que están disponibles para asistir."}, {"k": "li", "t": "Atentos si personas llegan de refuerzos por MG serán acreedores de una sanción grupal y robo perdido, deberán ser users activos en el servidor Lado delictivo o policial al momento de que el robo se inicie."}, {"k": "li", "t": "(ejemplo discord que no están en el servidor y les hablan y entran para ayudar)"}, {"k": "li", "t": "De esta manera dejaremos el robo y los roles como fairplay."}], "lv": null}, {"title": "2 - Cantidades", "blocks": [{"k": "p", "t": "Ahora los robos tienen un número máximo de personas para el mismo."}, {"k": "li", "t": "Tiendas = Máximo 2 delictivos. Mínimo 1 delictivo. DEFCON 1"}, {"k": "li", "t": "Fleeca = Máximo 3 delictivos, incluyendo 1 tirador. Mínimo 2 delictivos. DEFCON 2"}, {"k": "li", "t": "Joyería = Máximo 4 delictivos, (2 tiradores posibles) Minimo 3 Delictivos DEFCON 3"}, {"k": "li", "t": "Banco Paleto = Máximo 5 delictivos, incluyendo 2 tiradores. Mínimo 3. DEFCON 3"}, {"k": "li", "t": "Maze Bank = Máximo 8 delictivos, incluyendo 2 tiradores. Mínimo 3. DEFCON 3"}, {"k": "li", "t": "Bobcat Heist = Maximo 10 Ocupantes Delictivos, (2 tiradores posibles) Minimo 6, DEFCON 4"}, {"k": "li", "t": "Banco Central = Máximo 12 delictivos, incluyendo 2 tiradores. Mínimo 6. DEFCON 5"}, {"k": "li", "t": "Humane Labs = Máximo 14 ocupantes delictivos. Mínimo 6. DEFCON 5"}, {"k": "b", "t": "IMPORTANTE: ROLES DE DEFCON 5 NO SE PUEDE USAR TORRETA. Recuerden que los policías siempre serán 1 más que la cantidad de delictivos que haya en el robo."}], "lv": null}, {"title": "3 - NEGOCIACIÓN", "blocks": [{"k": "p", "t": "Siempre se iniciará a negociar con los rehenes."}, {"k": "p", "t": "Esto es fácil 1 rehén por una cosa, no pueden exigir de todo por 1 rehén"}, {"k": "p", "t": "Solicitudes de 1 rehén ( incluso si una opción te dejara quitar más cosas no es aplicable )."}, {"k": "p", "t": "Si en algún punto no se llega a nada y cancelan el ROBO ( policía ) el delincuente se puede ir con el botín y sin ningún problema."}, {"k": "b", "t": "Puedes pedir por 1 rehén lo siguiente:"}, {"k": "li", "t": "Segundos de escape ( máximo 3 segundos )."}, {"k": "li", "t": "Cancelar 1 Entrada ( Defcon 1 y 2 )."}, {"k": "li", "t": "No usar dardos trackeadores."}, {"k": "li", "t": "No usar Drones."}, {"k": "li", "t": "No usar Arrojadizos ( Aplica para ambas cosas granadas, molotov, granada de humo y bz )."}, {"k": "li", "t": "No usar casco ( Aplica para ambos bandos )."}, {"k": "li", "t": "No utilizar motocicletas ( Si el bando delictivo escapara en motocicleta no aplica )."}, {"k": "li", "t": "Escapar con salida limpia ( No intervención al salir del banco hasta que esté en movimiento )."}, {"k": "li", "t": "Escapar con huida limpia ( Respetar las reglas de tráfico en todo momento, si en algún punto se rompe esto dará pie a lanzar avisos, aplica también ir más de 120 km/h. )."}, {"k": "li", "t": "Limitar entrada de personas: 1 a 2 personas por rehén en robos de menos de 6 personas."}, {"k": "b", "t": "Dependerá la cantidad de personas que asistan al robo, por ejemplo; en un paleto de 5 lo justo es que se limite la entrada a 2 personas, si es un fleeca de 3 sería justo que se limitara a 1 persona."}, {"k": "b", "t": "Posibles solicitudes por 2 rehenes:"}, {"k": "li", "t": "Limitar Entrada De Personas: 3 personas por rehenes en robos con más de 7 personas."}, {"k": "li", "t": "Bajar Defcon ( Esto implica si el robo es defcon 5, poder bajarlo a defcon 4,3,2,1)."}, {"k": "li", "t": "Cancelar una Entrada ( Defcon 3 para arriba )."}, {"k": "li", "t": "Quitar el helicóptero ( Defcon 3 para arriba )."}, {"k": "b", "t": "Puntos a tomar en cuenta, esto solo funcionará si ambos bandos tienen la misma DEFCON. Si delictivo va a humane con armamento defcon 5 y policía también y deciden pedir cambio de defcon a 4 ambos deberán dejar su armamento defcon 5 y pasar a defcon 4. Entonces si un bando tiene defcon menor a la del robo y solicita bajarla cuando la policía viene con la defcon del robo no será posible solicitar BAJAR LA DEFCON."}], "lv": null}, {"title": "4 - REHENES", "blocks": [{"k": "li", "t": "Para secuestrar rehenes ( NPC o usuarios ) tienen que mandar su respectivo /entorno, si no lo mandan no se les contará estos rehenes para el robo."}, {"k": "li", "t": "Dado al caso que hayan mandado su /entorno por el o los rehénes y se llegan a desaparecer y cuentan con clip se les tomara en cuenta para negociar."}, {"k": "li", "t": "Para el uso de rehenes en robos necesitamos tomarlos fuera del entorno de robo, Los rehenes cercanos al lugar de robo no contarán ( Límite de distancia 2 cuadras para tomar rehenes para un robo )."}, {"k": "b", "t": "Límite de rehenes por robo:"}, {"k": "li", "t": "En robos chicos solo podremos llevar 2 rehenes como máximo ( Esto aplica para Tienditas )."}, {"k": "li", "t": "En robos medianos solo podremos llevar 3 rehenes como máximo ( Esto aplica para Fleeca, Joyería y BC de Paleto )."}, {"k": "li", "t": "En robos medianos/grandes solo podremos llevar a 4 rehenes como máximo ( Esto aplica para Maze Bank, Bobcat Y Joyería Rocks And Socks )."}, {"k": "li", "t": "En Robos grandes solo podremos llevar 5 rehenes como máximo ( Esto aplica para BC, Humane )."}, {"k": "li", "t": "Si no tenemos rehenes en robos podemos usar el BOTÍN como % para usarlo ( El % por solicitud debe ser del 15% si tenemos 10K podemos usar 1500$ para solicitar una OPCION de arriba, Solo aplicable a 2 solicitudes para un total de 30% osea 2 rehenes )."}, {"k": "p", "t": "QUE QUEDE ACLARADO LOS ROBOS SON FUNCIONALES, ESTÁN LOS VIDEOS PARA QUE SE GUIEN DE COMO ES EL PROCEDIMIENTO DE ROBO PARA EVITAR QUE ALTEREN EL ROBO O BUGGEARLOS , Sino hay dinero de su parte al robar algo no daremos el dinero por REPORTE ( amenos que literal encuentren un BUG nuevo, No aplica si cortan animaciones o llegan a buggiarlos )."}, {"k": "p", "t": "Deberán de acatar las órdenes de los delictivos por los rehenes o hacer una contraoferta sin extender mucho la negociación ( El jugar o no valorar la vida del rehén por parte de la policía será sancionado )."}], "lv": null}, {"title": "5 - TIRADOR", "blocks": [{"k": "p", "t": "Si se especifica X cantidad de tirador/es podrá ir un policía más a buscarlo"}, {"k": "b", "t": "Ejemplo:"}, {"k": "li", "t": "Si ponen 2 tiradores podrán buscarlo 3 policías."}, {"k": "li", "t": "El tirador no puede accionar hacia la gente de la negociación hasta que empiece el robo, podrá abatir a las personas que lo busquen, dado al caso podrá rotar hacia otras posiciones si es que ya está comprometido o expuesto pero solo podrá moverse alrededor del entorno del robo."}, {"k": "li", "t": "En el caso de que la policía abate a todos los integrantes dentro del robo y quedan los tiradores la regla conforme ir a buscarlos con un policía mas no aplica, pues solo faltarían estos para dar el robo por terminado podrán ir los policías disponibles o en pie en el robo a buscarlos."}], "lv": null}, {"title": "6 - DRONES", "blocks": [{"k": "li", "t": "El uso de drones es exclusivo de 1 por equipo ( Significa que solo 1 dron por lado podrá ser ejecutado )."}, {"k": "li", "t": "Cualquier mal uso del DRON será sancionado."}, {"k": "li", "t": "El dron no se puede usar en zona segura y tampoco se puede campear zonas seguras con el mismo."}, {"k": "li", "t": "El dron solo se puede ser utilizado en robos con DEFCON 2, además de que para poder utilizarlo en la calle la única manera es que tengan una investigación en curso, esta misma tendrán que mostrarla al staff para que no sean sancionados."}], "lv": null}, {"title": "7 - GRANADAS", "blocks": [{"k": "li", "t": "Solo pueden llevar 2 Granadas Que causen daño por grupo ( Estas son Defcon 4, recuerden leer zona de DEFCON ) ."}, {"k": "li", "t": "Extra podemos llevar 2 Granadas mas que no causen daño (Granada de humo y granada BZ)"}], "lv": null}, {"title": "8 - TIEMPOS DE RESPUESTA", "blocks": [{"k": "li", "t": "Si la policía nos acepta el robo y lo comienzan, pero ellos no asisten al robo por 15 minutos sin respuesta total por mensajes de /GOV ni asistencia física al robo, pueden robar todo y que se vayan sin miedo a ser sancionados ( RECOMENDACIÓN GRABAR O TENER PRUEBAS CONSISTENTES DE ESTO ) ."}, {"k": "b", "t": "Esto contará como actividad para su sección delictiva."}], "lv": null}, {"title": "9 - PREPOTENCIA EN NEGOCIACIONES", "blocks": [{"k": "li", "t": "Si se te capta o tienes algún clip donde se note la prepotencia en la fase de negociación y no se llega a nada puede ser sancionable dependiendo si es por parte de la policía o si es parte de los delincuentes ( deben de continuar si o si el rol en dado caso que pase esto y reportar al final de este )."}], "lv": null}, {"title": "10 - TEMAS DE CUÁNDO TIRAR DE “E” EN UN ROBO", "blocks": [{"k": "li", "t": "Podrás tirar de “E” siempre y cuando no se encuentre presente algún EMS en la zona, de esta manera tendrán que esperar la asistencia médica."}, {"k": "li", "t": "Si un EMS, Policía o Delictivo está roleando cacheo, búsqueda de DNI al estar abatido queda PROHIBIDO tirar de “E”"}, {"k": "li", "t": "Donde se note que no cumplen con el tiempo de espera conforme a los ejemplos ya mencionados será sanción directa."}, {"k": "li", "t": "Deberás esperar el total de tiempo para el respawn automático al estar ems en la zona o ser revisado o cateado por un policía ( Cuando acabe el policía y no ve ems o atención médica el te dira ya acabe en este momento tu podrás tirar de E sin problema pero no antes )."}], "lv": null}]}, {"id": "s3-reglamento-tems-de-efect", "title": "Reglamento Ítems De Efecto ( Chaleco + Heal )", "cards": [{"title": null, "blocks": [{"k": "p", "t": "Toda variante que implique mejoras como salud y chaleco sólo podrán ser portadas de 2 unidades como tope general, puede ser combinable."}, {"k": "b", "t": "Ejemplo:"}, {"k": "li", "t": "Podría llevar un gallo kush + un sputnik o llevar 2 chalecos pesados."}, {"k": "li", "t": "Llevar más en cualquier rol será sancionable."}, {"k": "li", "t": "Si tenemos una mochila, es aplicable (2 en mochila, y 2 en inventario personal)."}, {"k": "li", "t": "Las vendas también son un ítem de efecto pues generan salud entonces si se ve vendas + otros ítems de efecto será sancionable."}, {"k": "li", "t": "Las mala quantum o mala cola también son considerados ítems de efecto."}, {"k": "b", "t": "Para roles agresivos queda prohibido los ítems de la tienda Mystic Spells y el Café Bean Machine, ya que solo son de uso recreativo, si se sorprende su mal uso en ROLES PASIVOS serán acreedores de un BAN DIRECTO."}], "lv": null}, {"title": "MYSTIC SPELLS", "blocks": [{"k": "p", "t": "Se añadió una tienda de brujería llamada mystic spells, ellas tienen la normativa hablada con ellas conforme sus productos aquí tienen el resumen"}, {"k": "p", "t": "Los productos adquiridos aquí son para un uso recreativo (chill en rol)"}, {"k": "p", "t": "Todo item de esta tienda fuera de salud y armadura, Está prohibido su uso para temas de roles agresivos."}], "lv": null}, {"title": "EJEMPLOS", "blocks": [{"k": "li", "t": "Usarlos para ser invisible, animal, correr rápido en tiroteos, evasiones, forzadas de rol"}, {"k": "li", "t": "Temas de usarlo para darle ventaja a tu grupo o darte ventaja propia"}, {"k": "li", "t": "Pueden ser ejemplos en aves para avisarle a la gente desde la altura"}, {"k": "li", "t": "Ser invisible en medio de tiroteos y estar haciendo metagaming y PG para dar ventaja a tus amigos"}, {"k": "li", "t": "Rapidez para escapar, aplicar prácticas y mecánicas prohibidas en el servidor"}, {"k": "p", "t": "Resumen, solo para actividades con tus amigos enfocando un rol más serio y social."}, {"k": "li", "t": "Tienen productos que no se pueden robar, respetar pues es parte de lo mismo su rol"}, {"k": "li", "t": "El uso de la ouija es para temas de hablar con muertos misma dinámica de arriba solo para temas de roles más serios y sociales"}, {"k": "li", "t": "El uso del tarot misma dinámica de arriba solo para temas de roles más serios y sociales"}, {"k": "p", "t": "Actualizaremos conforme recabamos la info del uso práctico que le den."}], "lv": null}]}, {"id": "s4-reglamento-de-m-scaras-c", "title": "Reglamento De Máscaras, Chalecos & Vestimenta", "cards": [{"title": null, "blocks": [{"k": "li", "t": "Está prohibido tener chalecos, máscaras, y variantes de estas en cualquier zona segura oficial y zonas de entorno seguras ( lo más conocido es, tiendas de ropa, comida, restaurantes, negocios, empresas, garajes, hospitales, comisarías, mecánicos ya saben cómo funciona )."}, {"k": "li", "t": "la única manera de traer máscaras y chalecos es cuando estemos en rol de organización delictiva, robos o en zonas rojas."}, {"k": "li", "t": "Solo tendrá una advertencia si un staff los ve, se dará un anuncio y después se les sancionará."}], "lv": null}, {"title": "1 - Máscaras Y Cascos", "blocks": [{"k": "li", "t": "Como sabemos hay momentos donde máscaras o cascos/sombreros tanquean disparos, si se sabe que usan algo que genere un tanqueo para evitar morir ( 3 disparos están bien, pero 4 o más será reportable, si se demuestra en el clip que en realidad si tanquea será acreedor a un ban )."}, {"k": "li", "t": "Para delictivos, policía y organizaciones gubernamentales. Las máscaras tendrán que ser lo más real que se pueda, no está permitido uso de máscaras animadas, ficticias, animales, etc."}], "lv": null}, {"title": "2 - Uso De Radio, Animaciones Etc.", "blocks": [{"k": "li", "t": "Prohibido abusar de alguna animación para disparar, sacar armas rápido, etc."}, {"k": "li", "t": "Si en algún punto te da ventaja cualquiera de estas animaciones y te tienen en pruebas serás sancionado directamente."}], "lv": null}, {"title": "3 - Vestimenta ( Delictivo )", "blocks": [{"k": "li", "t": "Ropa: Está prohibido el uso de ropa que no corresponda al color de su banda, los roles delictivos deberán usar prendas adecuadas o correspondientes al rol ( Esto implica el no usar outfit sin sentido o temática PVP en pocas palabras TROLL )."}, {"k": "li", "t": "Bandas: Deberán ir con su respectivo color de organización y chaleco para cualquier rol agresivo. ( Representando mayormente el torso con el color correspondiente de su banda, si se ve que van con un % menor al 75% serán sancionados, no se permite portar chanclas, pantuflas ni ir descalzo si no se les dará una advertencia y si es consecutivo strike directo a la organización )."}], "lv": null}]}, {"id": "s5-reglamento-de-defcon", "title": "Reglamento De DEFCON", "cards": [{"title": "DEFCON 1: Alerta Base", "blocks": [{"k": "li", "t": "Uso de Pistolas Semiautomáticas ( No full auto ni variantes arriba de la .45 )."}, {"k": "li", "t": "Prohibido Uso De Revolver & Calibres .50. Prohibido Uso De Casco. Prohibido Usar Blindados o Torretas."}], "lv": 1}, {"title": "DEFCON 2 Duración Máxima De 30 Minutos", "blocks": [{"k": "li", "t": "Uso de Pistolas Auto, Pistolas.50, Revolver. Uso De Micro ametralladoras Y Subfusiles ( Uzi, mac10, h2smg, tec9, mp5, mp7, mp9, etc )."}, {"k": "li", "t": "Uso de Escopetas de bombeo, automáticas y de cartuchos."}, {"k": "li", "t": "Prohibido Uso De Casco."}, {"k": "li", "t": "Prohibido Usar Blindados O Torretas."}], "lv": 2}, {"title": "DEFCON CIUDAD Y NORTE", "blocks": [{"k": "li", "t": "DEFCON 3 Duración Máxima De 30 Minutos."}, {"k": "li", "t": "Uso de rifles de asalto."}, {"k": "li", "t": "Uso de Autos Blindados Permitidos."}, {"k": "li", "t": "Cascos Permitidos."}, {"k": "li", "t": "Prohibido Uso De Blindados Con Torretas."}], "lv": 3}, {"title": "DEFCON 4 Duración Máxima De 60 Minutos", "blocks": [{"k": "li", "t": "Uso De Rifles Ligeros ( MG, MG42, M60 )."}, {"k": "li", "t": "Uso de Francotirador De Corto Alcance & De Cerrojo ( Tipo Marksman Semiautomático & rifle sin mira )."}, {"k": "li", "t": "Uso de Arrojadizos como Granadas y Molotov. Uso De Autos Blindados Permitidos."}, {"k": "li", "t": "Cascos Permitidos."}, {"k": "li", "t": "Prohibido Uso De Blindados Con Torretas."}], "lv": 4}, {"title": "DEFCON 5 Duración Máxima De 60 Minutos", "blocks": [{"k": "li", "t": "Uso De Armamento De Cualquier Tipo Permitido ( Mosquete exclusivo de la 5 )."}, {"k": "li", "t": "Uso De Todos Los Vehículos Blindados Torretas Permitidos. Cascos Permitidos."}, {"k": "b", "t": "Lugares como Paleto, Sandy, y pueblos de norte siempre serán considerados DEFCON 2 son zonas donde hay más tema social y trabajos aquí, aunque haya territorios no pueden ejecutar armamento arriba de la DEFCON 2."}], "lv": 5}]}, {"id": "s6-reglamento-de-multiperso", "title": "Reglamento De Multipersonajes", "cards": [{"title": null, "blocks": [{"k": "p", "t": "A partir de ahora si quieres ser oficial de policía y tienes PJ DELICTIVO al mismo tiempo con el uso del multipersonaje, será decisión de los altos mandos si te aceptan o no."}, {"k": "b", "t": "Esto con la consecuencia de que se les tendrá más vigilados."}, {"k": "b", "t": "Abusos entre PJS de cualquier tipo con pruebas será vetado del sistema y solo quedaras con 1pj perdiendo tu donación y nunca más tener la posibilidad de tener 2 pjs."}], "lv": null}]}, {"id": "s7-reglamento-de-zonas-cali", "title": "Reglamento De Zonas Calientes", "cards": [{"title": null, "blocks": [{"k": "li", "t": "Uso de armamento LIBRE en las zonas designadas como Calientes ( Zonas rojas ) ."}, {"k": "li", "t": "En zonas calientes no existe el rol previo puedes llegar a disparar."}, {"k": "li", "t": "Una zona roja es por el entorno DEFCON 5, aquí no aplican las reglas de afuera ( torretas, refuerzos, armamento por DEFCONS ) todo dentro de la misma zona es válido."}, {"k": "li", "t": "Si se inicia un rol en zona roja se tiene que acabar dentro de esta misma, si llegan a salir es para huir y no regresar. Si se ve que salen y regresan, se sancionará a la organización."}, {"k": "li", "t": "Prohibido forzar roles e incitar a las personas a seguirlos y que su ROL se vuelva agresivo y termine en una zona caliente."}, {"k": "li", "t": "Tiendas de interacción ( Negocios, Ropa, Mercados ) son zonas seguras respetar estas mismas si están cercas de una zona caliente."}, {"k": "li", "t": "Se puede disparar de zona roja hacia afuera siempre y cuando estén seguros que estas personas vayan a defender la zona roja. Esto aplica para la normativa de disparar con torreta hacia afuera."}, {"k": "li", "t": "No está permitido campear las zonas ROJAS. Esto aplica a campear desde afuera respeten armamentos y demás, SANCIÓN DIRECTA Y ROL NULO A FAVOR DEL REPORTE EN CONTRA SIN APELAR ."}], "lv": null}, {"title": "TERRITORIOS", "blocks": [{"k": "li", "t": "No podrán tomar zonas de territorios por métodos aéreos (aviones, helicópteros)."}, {"k": "li", "t": "Solo está permitido ir en un vehículo blindado sin torreta y otro vehículo blindado con torreta, si se les ve que van en un vehículo deportivo en zonas altas puede ser sancionable, pues es considerado PG."}], "lv": null}]}, {"id": "s8-reglamento-de-zona-de-gu", "title": "Reglamento De Zona De Guerra (Gangs)", "cards": [{"title": null, "blocks": [{"k": "p", "t": "Todo user podrá visualizar una zona de guerra o conquista entran bajo su propio riesgo, como todo las bandas que acudan podrán dispararse dentro y fuera del cuadro pero aquí colocaremos lo que se permite y que no:"}, {"k": "b", "t": "EJEMPLO:"}, {"k": "li", "t": "Solo las bandas pueden solicitar la captura o reconquistar una zona establecida, fuera de eso los usuarios no podrán capturar."}, {"k": "li", "t": "Solo se podrá disparar si las bandas ingresan dentro la zona del cuadro fuera de eso si se dispara antes de que lleguen al cuadrante de captura pasará a sanción directa."}, {"k": "li", "t": "No se podrá campear y disparar desde fuera de la zona de guerra."}, {"k": "li", "t": "Persona que llegue al cuadro de guerra y no pertenezca a ninguna organización y solo se vea que va a molestar pasará a sanción directa."}, {"k": "li", "t": "La policía podrá acudir bajo su propio riesgo pero tendrán que acudir siempre puesto con sirena y parlantes para notificar que están llegando en camino a la zona."}], "lv": null}]}, {"id": "s9-reglamento-de-sedes-deli", "title": "Reglamento De Sedes Delictivas", "cards": [{"title": null, "blocks": [{"k": "p", "t": "Las sedes delictivas o comisarías no son lugares a seguir, ya que para cada organización son zonas seguras por el entorno para ellos."}, {"k": "b", "t": "Entonces estas zonas son neutrales no podemos entrar a disparar o disparar de fuera a las mismas con o sin rol Si hay disparos dentro EJEMPLO Delictivos y las alertas llaman a la policía, deben aguantar y cooperar con lo que hicieron multas procesamiento y demás si termina en disparos SANCIÓN DIRECTA AL DELICTIVO."}, {"k": "li", "t": "Si una persecución termina en tu sede podrán hacer uso del DEFCON establecido en la ciudad en ese momento, no puedes utilizar otro DEFCON superior al que esté activo."}, {"k": "li", "t": "Para poder hacer redadas en sedes enemigas ( BANDA VS BANDA ) deberán tener al menos una investigación en curso y pruebas de al menos 9 días sobre cada uno"}, {"k": "p", "t": "de los integrantes de la organización, esta redada tendrá las mismas reglas que un CK usuario de banda."}], "lv": null}]}, {"id": "s10-reglamento-de-ck", "title": "Reglamento De CK", "cards": [{"title": "Tema Relacionado A CK ( Muerte total del personaje )", "blocks": [{"k": "p", "t": "Al recibir una muerte total de tu personaje, perderás todo lo relacionado a él IG ( coches, casas, dinero, ítems, etc.)."}, {"k": "p", "t": "No puedes rolear con tus amistades de tu vida anterior, por lo menos en 7 días después de eso ya podrás socializar de vuelta con ellos con tu nuevo personaje."}, {"k": "p", "t": "Si se te ve que al recibir CK lo primero que haces es ir directo con tu grupo o conocidos serás acreedor de un baneo de 3 días, después de pasar el baneo se reiniciaran los 7 días para rolear con ellos y si vuelve a pasar duplicaremos cada suma, baneo y espera."}, {"k": "p", "t": "Solo se permiten 3 CKS administrativos y voluntarios ( Esto aplica por personaje )."}, {"k": "p", "t": "Si por accidente mueres de maneras en donde el CK es obligatorio se hará sin previo aviso, entonces nada de estar tirándose de edificios a medio rol porque quieras escapar etc."}, {"k": "p", "t": "Para aplicar un CK por parte de usuarios necesitan pruebas completas de la persona a eliminar, esto quiere decir que debe haber una investigación de por medio."}, {"k": "li", "t": "Fotos del DNI ( 5 Fotos de días distintos )."}, {"k": "li", "t": "Fotos De Al Menos 3 Coches Distintos"}, {"k": "li", "t": "Información de lugares que procura diariamente."}, {"k": "li", "t": "Información de otros compañeros o amigos que lo conozcan."}, {"k": "p", "t": "Tienen que levantar un ticket para que el STAFF autorice el CK. Importante: Cualquier traspaso de bienes relacionados a dinero, armas, ítems, etc. Será un baneo para los usuarios que estén relacionados a esta acción."}, {"k": "p", "t": "Para personas que hicieron DONACIONES, no pierden nada SE LES ENTREGARÁ EN SU SIGUIENTE VIDA, cualquier donación después de un CK vuelve a ti y no perderás ninguna hasta el hipotético caso de que el servidor sea apagado ( Todo esto lo puedes reclamar con los comprobantes de donación )."}], "lv": null}, {"title": "1 - CK USUARIO DE BANDA", "blocks": [{"k": "p", "t": "Para lograr un CK de usuarios de banda necesita lo siguiente:"}, {"k": "li", "t": "Fotos del DNI ( 9 fotos en días distintos )."}, {"k": "li", "t": "Fotos De Al Menos 3 vehículos diferentes en distintos días."}, {"k": "li", "t": "Información de lugares que procura diariamente ( Mínimo 3 )."}, {"k": "li", "t": "Información de otros compañeros, amigos o personas que lo conozcan ( Mínimo 2 )."}, {"k": "li", "t": "Casas o sede de grupo donde procure diariamente. ( Mínimo 2 lugares )."}], "lv": null}, {"title": "2 - CK DE BANDA", "blocks": [{"k": "p", "t": "Para desmantelar una banda, para policía o grupos delictivos."}, {"k": "p", "t": "Para realizar esto, deberán tener una investigación sobre mínimo 4 INTEGRANTES DE LA BANDA , cuando tengan esta investigación tendrás que realizar un ticket con la información para que el staff pueda autorizarlo."}, {"k": "b", "t": "Si se autoriza por parte del STAFF, se hará un rol de ya sea las dos organizaciones o policía vs organización, este rol será DEFCON 4 y el cual consistirá en la siguiente manera:"}, {"k": "p", "t": "La banda investigada tendrá que defenderse en su sede u otro lugar de referencia y la policía u organización contraria tendrá que atacar, estos que atacarán tendrán beneficio de ser 2 integrantes más que los que defienden."}, {"k": "p", "t": "Si los que defiende son 6, los atacantes tendrán que ser 8. Si se mueren todos los que defienden se les hará CK a la organización, en caso contrario que estos ganen, lo que pasará es que los atacantes perderán toda información de la investigación y se les cambiara de sede a la organización que logró defenderse, aunque no va a recuperar lo que tenia se le dará un ayuda."}], "lv": null}, {"title": "3 - CK A Policía", "blocks": [{"k": "p", "t": "Para lograr un CK a un policía necesitan lo siguiente:"}, {"k": "li", "t": "Foto De La Persona Con El Uniforme ( Mínimo 14 en días distintos )."}, {"k": "li", "t": "Foto De La Placa Policial ( Mínimo 14 en días distintos )."}, {"k": "li", "t": "Foto De DNI cuando esté fuera de servicio (Mínimo 9 en días distintos)."}, {"k": "li", "t": "Fotos De Al Menos 3 Coches Distintos Personales o Sobre Vehículos Policiales."}, {"k": "p", "t": "Para poder aplicar el CK tendrán que levantar un ticket con las pruebas para que el STAFF lo autorice."}, {"k": "b", "t": "Los policías si ven corrupción con pruebas también haremos CK a los involucrados."}, {"k": "p", "t": "En el caso de que tengan pruebas claras de que el policía investigado nunca sale de servicio, ahí será verificado por el STAFF y con las pruebas que muestran se decidirá si se autoriza el mismo."}, {"k": "b", "t": "Queda totalmente prohibido usar información de tu vida pasada, si se te sorprende usando información a beneficio propio en tu nueva vida será una BAN de 7 días sin apelación, recuerda que es muerte TOTAL de tu personaje y no debes saber esa información."}, {"k": "b", "t": "Ejemplo:"}, {"k": "p", "t": "Si en tu primera vida fuiste delictivo y en tu nueva vida eres policía y usar información de cuando eras delictivo para beneficiar a la policía, será tomado como MG porque es información que no conseguiste IG."}], "lv": null}]}, {"id": "s11-reglamento-pkt", "title": "Reglamento PKT", "cards": [{"title": "Parcial Kill Total (PKT)", "blocks": [{"k": "p", "t": "Es una ramificación del PK."}, {"k": "p", "t": "Se aplica usualmente cuando te echan de una facción y para hacerlo te asesinan, aunque también puede ser aplicado para la pérdida del conocimiento de grandes roles. Debido a que la mayoría de tus roles tienen conexión con dicha facción, es necesario que tu personaje pierda el conocimiento de todos esos roles para continuar. Si recibes un PKT, no podrás contar los secretos de la facción sin que esto sea considerado MG. Tampoco podrás vengarte de la misma, y en lo posible deberás de tratar de no interactuar con ella. Esta norma está diseñada más que nada para defender a las facciones que deciden matar a miembros fastidiosos o molestos, los cuales no dudarían en dar toda la información de la facción si los echan de la misma."}, {"k": "p", "t": "Para poder aplicarlo es necesario levantar un ticket con pruebas del por qué quieres realizar el PKT, el STAFF lo checara si lo autoriza."}, {"k": "b", "t": "IMPORTANTE:"}, {"k": "p", "t": "Cualquier falta de este texto o relación al PKT no respetada acabará en un CK para tu personaje y una sanción. Si Recibes un PKT y pasas tus cosas en múltiples amigos, ellos llevarán un CK administrativo y tu un baneo inicial de 7 días dependiendo la gravedad y tu propio CK."}, {"k": "p", "t": "Para un PKT exitoso necesitamos seriedad, no se estarán aceptando PKTS rápidos que de 7 días cambies y otros 7 días los mismos, esto es abuso para moverte de facciones implica en un baneo."}], "lv": null}]}, {"id": "s12-reglamento-estando-en-un", "title": "Reglamento Estando En Un Auto/Heli/Moto", "cards": [{"title": "Prohibido disparar a matar desde cualquier tipo de vehículo, helicópteros y motos", "blocks": [{"k": "li", "t": "Si estas a pie tú puedes matar a la gente adentro del vehículo, la regla PROHÍBE MATAR GENTE estando dentro del vehículo de afuera/adentro no está mal para que quede claro."}, {"k": "b", "t": "Pueden disparar a llantas solo para inutilizar el vehículo, esto incluye al conductor del vehículo."}, {"k": "p", "t": "Ahora, si te pinchan un auto perderá velocidad hasta quedarse quieto, si ponchan las 2 llantas parara el auto en completo y lo apagara sin opción a moverse, deberán repararlo para volver a moverse."}, {"k": "p", "t": "Aun así y para aclararlo pueden seguir con una llanta ponchada y en rin, con dos llantas ponchadas tendrán que detenerse para repararlo, no podrán seguir avanzando, si lo hacen se considerará PG y serán sancionados."}], "lv": null}, {"title": "Motocicletas y Coches 4X4 relación PG", "blocks": [{"k": "p", "t": "Está prohibido usar modelos de 4x4 + motocicletas exagerando el PG en las partes donde un super o compacto no pueden."}, {"k": "b", "t": "Ejemplo:"}, {"k": "p", "t": "Rampear a velocidades sin lógica y avanzar como si nada sin ser afectado por
